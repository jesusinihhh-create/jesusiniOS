<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jesusiniOS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="desktop">
  <div class="desktop-icons">
    <button class="desktop-icon" data-app="computer"><span>🖥️</span><small>This PC</small></button>
    <button class="desktop-icon" data-app="notepad"><span>📝</span><small>Notepad</small></button>
    <button class="desktop-icon" data-app="paint"><span>🎨</span><small>Paint</small></button>
    <button class="desktop-icon" data-app="settings"><span>⚙️</span><small>Settings</small></button>
    <button class="desktop-icon" data-app="terminal"><span>⌨️</span><small>Terminal</small></button>
  </div>
  <div id="windows"></div>
  <section id="start-menu" class="start-menu hidden">
    <div class="start-brand"><div class="brand-mark">j</div><div><b>jesusiniOS</b><small>Make it yours.</small></div></div>
    <div class="start-search"><span>⌕</span><input id="app-search" placeholder="Type here to search apps"></div>
    <div class="start-label">All apps</div>
    <div class="app-list">
      <button data-app="notepad">📝 <span>Notepad</span></button>
      <button data-app="paint">🎨 <span>Paint</span></button>
      <button data-app="settings">⚙️ <span>Settings</span></button>
      <button data-app="terminal">⌨️ <span>Terminal</span></button>
      <button data-app="calculator">🧮 <span>Calculator</span></button>
      <button data-app="computer">🗂️ <span>File Manager</span></button>
    </div>
    <div class="start-bottom"><span>● jesusini</span><button id="power-btn">⏻ Power</button></div>
  </section>
  <div id="toast" class="toast hidden"></div>
  <footer class="taskbar">
    <button id="start-btn" class="start-button" title="Start"><span class="win-logo">▦</span></button>
    <button class="task-search" id="search-btn">⌕ <span>Search</span></button>
    <div class="task-pins">
      <button data-app="computer" title="File Manager">🗂️</button>
      <button data-app="notepad" title="Notepad">📝</button>
      <button data-app="paint" title="Paint">🎨</button>
      <button data-app="settings" title="Settings">⚙️</button>
      <button data-app="terminal" title="Terminal">⌨️</button>
    </div>
    <div class="task-spacer"></div>
    <div class="tray"><span>ENG</span><span>◖</span><span>🔊</span><span id="clock">12:00</span></div>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
